# Preferences are separate from Pueue's own configuration.
# Credential fields contain paths only. Never paste a shared secret here.
default_connection = "all"

[tui]
refresh_seconds = 2
background_seconds = 5
mouse = true

[logs]
single_mode = "auto" # local/native live; SSH polling
multi_mode = "poll" # live, poll, or manual
poll_interval = "10s"
tail_lines = 200

[[connections]]
id = "local"
name = "Local"
kind = "local"
# binary = "/opt/homebrew/bin/pueue"
# config_path = "/absolute/path/to/pueue.yml"

[[connections]]
id = "lab"
name = "Lab over SSH"
kind = "ssh"
ssh_host = "lab-server" # An existing alias in ~/.ssh/config
# binary = "/home/user/.cargo/bin/pueue"
# config_path = "/home/user/.config/pueue/pueue.yml" # Remote path
# profile = "batch"

[connections.logs]
poll_interval = "30s" # This connection overrides the global interval.

# Native connection through an existing local Pueue client configuration.
# Uncomment the whole block after configuring Pueue's TLS or forwarded socket.
# [[connections]]
# id = "native-lab"
# name = "Lab native"
# kind = "native"
# config_path = "/home/user/.config/pueue/remote.yml" # Local path
