version: 2
project_name: lazypueue
before:
  hooks:
    - sh scripts/release-completions.sh
builds:
  - id: lazypueue
    main: .
    binary: lazypueue
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{ .Version }} -X github.com/daviddwlee84/lazypueue/internal/selfupdate.ReleaseStamp=archive-v1:v{{ .Version }}
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - completions/lazypueue.bash
      - completions/lazypueue.zsh
checksum:
  name_template: checksums.txt
release:
  draft: true
changelog:
  use: git
