name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o lazypueue .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyte==0.8.2
      - run: python3 scripts/form_pty_smoke.py --binary ./lazypueue
      - run: python3 scripts/pty_smoke.py --binary ./lazypueue
