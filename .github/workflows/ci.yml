name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Test immutable release publication
        run: python3 -m unittest discover -s scripts -p test_release.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o lazypueue .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyte==0.8.2
      - run: python3 scripts/form_pty_smoke.py --binary ./lazypueue
      - run: python3 scripts/pty_smoke.py --binary ./lazypueue

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test immutable release publication
        run: python3 -m unittest discover -s scripts -p test_release.py
      - name: Test independent distribution boundaries
        if: hashFiles('scripts/check-distribution.py') != ''
        run: python3 -m unittest discover -s scripts -p test_distribution.py
      - name: Build real source archive and Go module ZIP
        if: hashFiles('scripts/check-distribution.py') != ''
        run: python3 scripts/check-distribution.py
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - name: Load the publisher from this tested workflow revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git show "${WORKFLOW_SHA}:scripts/release.py" > "$RUNNER_TEMP/release-publisher.py"
      - name: Verify four binaries and source payload
        run: python3 "$RUNNER_TEMP/release-publisher.py" check --project lazypueue --binary lazypueue --smoke

  windows-distribution:
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
